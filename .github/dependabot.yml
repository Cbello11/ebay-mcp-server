version: 2
updates:
  # NPM dependencies - weekly security updates
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
    open-pull-requests-limit: 5
    reviewers:
      - 'Cbello11'
    assignees:
      - 'Cbello11'
    labels:
      - 'dependencies'
      - 'security'
    commit-message:
      prefix: 'chore(deps):'
      include: 'scope'
    pull-request-branch-name:
      separator: '/'
    allow:
      - dependency-type: 'all'
    ignore:
      # Ignore major version bumps for critical MCP/Effect libraries
      # (we'll handle those manually to test compatibility)
      - dependency-name: '@modelcontextprotocol/sdk'
        update-types: ['version-update:semver-major']
      - dependency-name: 'effect'
        update-types: ['version-update:semver-major']
    # Vulnerability alerts
    rebase-strategy: 'auto'

